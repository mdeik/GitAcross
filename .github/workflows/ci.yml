name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure Python is installed
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            echo "Python3 not found, installing..."
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -y && apt-get install -y python3 python3-pip python3-venv
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache python3 py3-pip
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y python3 python3-pip
            fi
          else
            echo "Python is already installed: $(python3 --version)"
          fi

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Run test suite via pytest with coverage gate
        run: |
          pytest tests/ -v --cov=gitacross

      - name: Verify CLI and standalone execution
        run: |
          gitacross --help
          python main.py --help

  auto-tag:
    name: Auto Tag from pyproject.toml
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version and create git tag
        run: |
          VERSION=$(grep -m1 '^version *=' pyproject.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "Error: Version not found in pyproject.toml"
            exit 1
          fi

          TAG="v$VERSION"
          echo "Current pyproject.toml version: $VERSION (tag: $TAG)"

          # Check if the tag already exists in local or remote refs
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists ($(git rev-parse --short $TAG)). No new tag needed."
          else
            echo "Tag $TAG does not exist. Creating and pushing tag..."
            git config user.name "gitea-actions[bot]"
            git config user.email "gitea-actions[bot]@noreply"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Successfully created and pushed tag $TAG"
          fi
