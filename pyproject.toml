[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitacross"
version = "2.1.0"
description = "Mirror releases and git commits across platforms (Gitea, GitHub, local) with transform pipelines."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Matthew Deik" }
]
keywords = ["git", "gitea", "github", "mirror", "sync", "release"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build",
    "twine",
]

[project.scripts]
gitacross = "gitacross.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["gitacross"]
# Keep branch measurement on for the report, but don't gate on it —
# a 100% branch gate incentivizes line-touching tests over behavior tests.
branch = true

[tool.coverage.report]
# Enforcement floor with headroom: catches regressions without demanding
# 100% (which encourages tests-for-the-sake-of-it on defensive branches).
fail_under = 90
show_missing = true
